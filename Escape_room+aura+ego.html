<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="KINGS">
<title>Escape Room CNA: Brinque com o Chuck</title>
<!-- Made by KINGS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0405; --red:#a3121a; --red-d:#5a0409; --blood:#c4161f;
  --bone:#efe3d2; --denim:#2a4575; --denim-d:#1b2e50; --teal:#2f8f86; --green:#3f7a3a;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--bone);position:relative;overflow-x:hidden;
  font-family:"Special Elite","Courier New",monospace;line-height:1.6;
  background:radial-gradient(ellipse at 50% 30%,#8f0f17 0%,#4a070c 55%,var(--bg) 100%) fixed;
}
body::before{ /* grão e vinheta */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
  animation:flick 7s infinite;
}
@keyframes flick{0%,41%,45%,100%{opacity:1}42%{opacity:.55}43%{opacity:1}44%{opacity:.7}}
.drip{position:absolute;top:0;left:0;width:100%;height:120px;z-index:2;pointer-events:none}
.stripes{height:14px;background:repeating-linear-gradient(90deg,#d8d0c0 0 18px,var(--red) 18px 36px,var(--teal) 36px 54px,var(--green) 54px 72px)}
main{position:relative;z-index:3;max-width:760px;margin:0 auto;padding:60px 20px 70px;text-align:center}
h1{
  font-family:Creepster,"Impact",cursive;font-weight:400;margin:0;
  font-size:clamp(2.8rem,11vw,5.4rem);line-height:.95;letter-spacing:.04em;color:#f1e4d3;
  text-shadow:0 0 22px rgba(0,0,0,.9),4px 4px 0 var(--red-d),0 0 40px rgba(196,22,31,.8);
}
.sub{max-width:36ch;margin:.8rem auto 1rem;font-size:1.05rem;text-shadow:0 2px 6px #000}
.hero{position:relative;width:min(560px,100%);margin:0 auto}
.hero img{
  width:100%;display:block;image-rendering:auto;
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 55%,transparent 98%);
          mask-image:radial-gradient(ellipse at 50% 50%,#000 55%,transparent 98%);
  filter:contrast(1.1) saturate(1.15) drop-shadow(0 0 24px #000);
  animation:loom 8s ease-in-out infinite;
}
@keyframes loom{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.say{font-size:1.3rem;margin:.6rem 0 .2rem;text-shadow:0 2px 8px #000}
.clue{max-width:40ch;margin:0 auto 1.4rem;color:#e6c9bd;font-size:.95rem;text-shadow:0 2px 6px #000}
/* painel de macacão jeans manchado de sangue */
.panel{
  position:relative;padding:26px 16px 22px;border-radius:10px;
  border:3px dashed #e0c07a;outline:6px solid var(--denim-d);
  background:
    radial-gradient(circle at 12% 20%,rgba(150,10,16,.75) 0 18px,transparent 40px),
    radial-gradient(circle at 88% 78%,rgba(150,10,16,.8) 0 24px,transparent 52px),
    radial-gradient(circle at 70% 12%,rgba(120,8,12,.7) 0 10px,transparent 28px),
    repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 5px),
    var(--denim);
  box-shadow:0 12px 40px #000;
}
.slots{display:flex;gap:14px;justify-content:center;margin-bottom:1.4rem}
.slot{width:56px;height:56px;border:2px dashed rgba(0,0,0,.55);border-radius:6px;display:grid;place-items:center;font-size:2rem;color:var(--blood);background:rgba(0,0,0,.4)}
.slot.on{border:2px solid var(--blood);box-shadow:0 0 14px rgba(196,22,31,.8)}
.pad{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.sym{
  width:104px;height:104px;border-radius:8px;cursor:pointer;font-size:3.4rem;line-height:1;color:var(--bone);
  background:linear-gradient(160deg,#4a0a10,#1a0507);border:3px dashed #c9a85f;
  box-shadow:inset 0 0 18px #000,0 5px 0 #000;transition:transform .12s,color .12s,border-color .12s;
}
.sym:hover{color:#fff;border-color:var(--blood);transform:translateY(-3px) rotate(-2deg)}
.sym:active{transform:translateY(1px)}
.sym:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sym.used{color:var(--blood);border-color:var(--blood);box-shadow:inset 0 0 18px #000,0 0 20px rgba(196,22,31,.8)}
.sym:disabled{cursor:default;transform:none}
.msg{min-height:3.4em;margin:1.2rem 0 0;font-size:1.1rem;color:#ffd9cf;text-shadow:0 2px 6px #000}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
/* susto ao errar: apagão, close no rosto e cortes de faca */
#scare{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#000;overflow:hidden}
#scare.on{display:grid}
#scare .txt{position:absolute;font-family:Creepster,cursive;font-size:clamp(2rem,9vw,4rem);color:var(--blood);text-shadow:0 0 18px #000;opacity:0}
#scare.dark .txt{animation:whisper .55s steps(6) forwards}
@keyframes whisper{0%{opacity:0}30%{opacity:1}50%{opacity:.3}70%,100%{opacity:1}}
#scare .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform-origin:50% 40%;filter:contrast(1.35) brightness(1.45);opacity:0}
#scare.boo .face{opacity:1;animation:zoom 1.8s cubic-bezier(.1,.9,.2,1) forwards}
@keyframes zoom{0%{transform:scale(1.05)}8%{transform:scale(2.3)}30%{transform:scale(2.1) translate(-1%,1%)}50%{transform:scale(2.5) translate(1%,-1%)}100%{transform:scale(2.3)}}
#scare svg{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#scare.boo svg{opacity:1}
#scare .sl{stroke:var(--blood);stroke-width:12px;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px #000)}
#scare.boo .sl{animation:cut .22s .2s forwards}
#scare.boo .sl:nth-child(2){animation-delay:.34s}
#scare.boo .sl:nth-child(3){animation-delay:.48s}
@keyframes cut{to{stroke-dashoffset:0}}
#scare.boo::after{content:"";position:absolute;inset:0;background:#fff;pointer-events:none;animation:fl .18s forwards}
@keyframes fl{to{opacity:0}}
@media (prefers-reduced-motion:reduce){#scare::after{display:none}}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:35;font:inherit;font-size:.85rem;color:var(--bone);background:rgba(0,0,0,.6);border:2px solid var(--red-d);border-radius:6px;padding:6px 12px;cursor:pointer}
.mute:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* vídeo */
#reveal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(6,1,2,.95)}
#reveal.open{display:grid}
.box{position:relative;width:min(720px,100%);background:#1a0608;border:3px solid var(--blood);border-radius:10px;padding:16px;box-shadow:0 0 50px rgba(196,22,31,.6)}
.box h2{font-family:Creepster,cursive;font-weight:400;color:var(--blood);font-size:2.1rem;margin:0 0 10px;text-shadow:2px 2px 0 #000}
video,.fallback{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;display:block}
.fallback{display:none;place-items:center;font-size:clamp(4rem,18vw,8rem);animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}
.note{font-size:.85rem;color:#c9aaa0;margin:10px 0}
.again{font:inherit;color:var(--bone);background:var(--red-d);border:2px solid var(--blood);border-radius:6px;padding:8px 18px;cursor:pointer}
.again:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* marca d'água escondida: quase invisível, aparece ao passar o mouse, tocar ou selecionar */
.wm{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.04);user-select:all;cursor:default;transition:color .3s}
.wm:hover,.wm:active{color:rgba(255,255,255,.85);text-shadow:0 0 8px var(--blood)}
.wm::selection{background:var(--blood);color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>

    <p class="note" id="note"></p>
    <button class="again" id="again">Jogar de novo</button>

const ctx = () => { const c = snd.c || (snd.c = new (window.AudioContext||window.webkitAudioContext)()); if(c.state==="suspended") c.resume(); return c; };

function beat(){
  try{ const c=ctx(); [0,.27].forEach(d=>{ const t=c.currentTime+d,o=c.createOscillator(),g=c.createGain();
    o.frequency.setValueAtTime(65,t); o.frequency.exponentialRampToValueAtTime(35,t+.18);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.2);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+.22); }); }catch(e){}
}
function scream(){
  try{
    const c=ctx(),t=c.currentTime,D=1.7;
    const cv=new Float32Array(2048); for(let i=0;i<2048;i++) cv[i]=Math.tanh((i/1024-1)*16);
    const ws=c.createWaveShaper(); ws.curve=cv; ws.oversample="4x";
    const out=c.createGain(); out.gain.setValueAtTime(.4,t); out.gain.setValueAtTime(.4,t+D-.5); out.gain.exponentialRampToValueAtTime(.001,t+D);
    ws.connect(out).connect(c.destination);
    const sum=c.createGain();
    [[600,900],[1200,1900]].forEach(([a,b])=>{ const f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=4;
      f.frequency.setValueAtTime(a,t); f.frequency.linearRampToValueAtTime(b,t+D); sum.connect(f); f.connect(ws); });
    const vib=c.createOscillator(), vg=c.createGain(); vib.frequency.value=11; vg.gain.value=35; vib.connect(vg); vib.start(t); vib.stop(t+D);
    [[520,980],[528,1000],[260,490]].forEach(([a,b])=>{ const o=c.createOscillator(); o.type="sawtooth";
      o.frequency.setValueAtTime(a,t); o.frequency.exponentialRampToValueAtTime(b,t+.5); o.frequency.linearRampToValueAtTime(b*.8,t+D);
      vg.connect(o.frequency); o.connect(sum); o.start(t); o.stop(t+D); });
    const gr=c.createOscillator(), gg=c.createGain(), am=c.createOscillator(), ag=c.createGain();
    gr.type="sawtooth"; gr.frequency.setValueAtTime(75,t); gr.frequency.exponentialRampToValueAtTime(42,t+D); gg.gain.value=.5;
    am.frequency.value=48; ag.gain.value=.5; am.connect(ag).connect(gg.gain);
    gr.connect(gg).connect(ws); gr.start(t); am.start(t); gr.stop(t+D); am.stop(t+D);
    const n=c.sampleRate*D,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=b; const hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1500;
    const ng=c.createGain(); ng.gain.value=.35; s.connect(hp).connect(ng).connect(ws); s.start(t);
    const k=c.createOscillator(),kg=c.createGain(); k.frequency.setValueAtTime(90,t); k.frequency.exponentialRampToValueAtTime(30,t+.4);
    kg.gain.setValueAtTime(.6,t); kg.gain.exponentialRampToValueAtTime(.001,t+.5); k.connect(kg).connect(c.destination); k.start(t); k.stop(t+.55);
  }catch(e){}
}
function jumpscare(done){
  const s=$("#scare");
  music.hold=.03; level();
  s.className="on dark"; beat();
  setTimeout(()=>{ s.className="on boo"; scream(); },600);
  setTimeout(()=>{ s.className=""; music.hold=null; level(); done(); },2400);
}

/* trilha sonora: drone grave, gemidos agudos, rangidos, coração e uma caixinha de música desafinada */
const music = {want:false, ready:false, hold:null, t:null, touched:false};
const bgm = MUSIC_SRC ? Object.assign(new Audio(MUSIC_SRC),{loop:true}) : null;
function reverb(c){
  const n=c.sampleRate*2.6, b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5); }
  const cv=c.createConvolver(); cv.buffer=b; return cv;
}
function build(){
  const c=ctx(), m=c.createGain(); m.gain.value=0; m.connect(c.destination);
  const rv=reverb(c), rg=c.createGain(); rg.gain.value=.7; rv.connect(rg).connect(m);
  const bus=c.createGain(); bus.connect(m); bus.connect(rv);
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=260; lp.connect(bus);
  [[55,"sawtooth",.10],[55.8,"sawtooth",.10],[36.7,"sine",.25],[77.8,"triangle",.05]].forEach(([f,ty,gv])=>{
    const o=c.createOscillator(), gn=c.createGain(); o.type=ty; o.frequency.value=f; gn.gain.value=gv; o.connect(gn).connect(lp); o.start();
  });
  const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=.07; lg.gain.value=110; lfo.connect(lg).connect(lp.frequency); lfo.start();
  Object.assign(music,{c,m,bus,ready:true});
}
function tone(f,dur,type,g,bend){
  const c=music.c,t=c.currentTime,o=c.createOscillator(),gn=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(bend) o.frequency.exponentialRampToValueAtTime(f*bend,t+dur);
  gn.gain.setValueAtTime(.0001,t); gn.gain.exponentialRampToValueAtTime(g,t+dur*.3); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(music.bus); o.start(t); o.stop(t+dur+.05);
}
const EV = [
  ()=>tone(700+Math.random()*700,3.5,"sine",.05,.94),
  ()=>beat(),
  ()=>tone(90+Math.random()*40,1.1,"sawtooth",.04,.7),
  ()=>[293.7,349.2,440,392,349.2,329.6].forEach((f,i)=>setTimeout(()=>music.want&&tone(f*.98,.9,"triangle",.07),i*520))
];
function loop(){ if(!music.want) return; EV[Math.floor(Math.random()*EV.length)](); music.t=setTimeout(loop,3500+Math.random()*5000); }
function level(){ const v=music.want?(music.hold==null?.55:music.hold):0;
  if(bgm){ bgm.volume=Math.min(1,v/.55); if(v>0) bgm.play().catch(()=>{}); else bgm.pause(); return; }
  if(!music.ready) return; music.m.gain.setTargetAtTime(v,music.c.currentTime,.25); }
function toggleMusic(force){
  music.want = force!==undefined ? force : !music.want;
  if(music.want){ if(!bgm){ if(!music.ready) build(); clearTimeout(music.t); music.t=setTimeout(loop,1500); } ctx(); level(); }
  else{ clearTimeout(music.t); level(); }
  const b=$("#mute"); b.setAttribute("aria-pressed",music.want); b.textContent=music.want?"🔊 Trilha ligada":"🔈 Ligar trilha";
}
$("#mute").addEventListener("click",()=>{ music.touched=true; toggleMusic(); });
addEventListener("pointerdown",e=>{ if(music.touched) return; music.touched=true; if(e.target.id!=="mute") toggleMusic(true); });

function snd(kind){
  try{
    const c = snd.c || (snd.c = new (window.AudioContext||window.webkitAudioContext)());
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    const bad = kind==="bad", tick = kind==="tick", d = bad?.7:tick?.12:1.2;
    o.type = bad ? "sawtooth" : "sine";
    o.frequency.setValueAtTime(bad?220:tick?110:70,t);
    o.frequency.exponentialRampToValueAtTime(bad?35:tick?55:28,t+d);
    g.gain.setValueAtTime(bad?.3:.2,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
function pintar(){
  slots.forEach((s,i)=>{ s.textContent = seq[i] ? ICON[seq[i]] : ""; s.classList.toggle("on", !!seq[i]); });
  btns.forEach(b=>b.classList.toggle("used", seq.includes(b.dataset.k)));
}
function resetar(){ seq=[]; pintar(); }

function abrir(){
  travado = true; btns.forEach(b=>b.disabled=true);
  const v = $("#vid"), fb = $("#fb");
  if(VIDEO_SRC){
    v.src = VIDEO_SRC; v.style.display="block"; fb.style.display="none"; $("#note").textContent="";
    v.onerror = ()=>{ v.style.display="none"; fb.style.display="grid"; $("#note").textContent="Não foi possível carregar o vídeo. Mostrando o espaço reservado."; };
  }else{
    v.style.display="none"; fb.style.display="grid";
    $("#note").textContent = "Vídeo genérico de espaço reservado. Defina VIDEO_SRC no código para usar o vídeo real.";
  }
  $("#reveal").classList.add("open"); music.hold=0; level();
  $("#again").focus();
}

btns.forEach(b=>b.addEventListener("click",()=>{
  if(travado || seq.includes(b.dataset.k)) return;
  seq.push(b.dataset.k); pintar();
  const i = seq.length-1;
  if(seq[i] !== SENHA[i]){
    travado = true;
    $("#msg").textContent = SCARE[erros++ % SCARE.length];
    jumpscare(()=>{
      $("#pad").classList.add("shake"); $("#slots").classList.add("shake");
      setTimeout(()=>{
        $("#pad").classList.remove("shake"); $("#slots").classList.remove("shake");
        resetar(); travado = false;
      },500);
    });
  }else if(seq.length === SENHA.length){
    snd("ok"); $("#msg").textContent = "Você acertou. Ele está ouvindo...";
    setTimeout(abrir,700);
  }else{
    snd("tick"); $("#msg").textContent = "Continue...";
  }
}));

$("#again").addEventListener("click",()=>{
  const v=$("#vid"); v.pause(); v.removeAttribute("src"); v.load();
  $("#reveal").classList.remove("open"); music.hold=null; level();
  btns.forEach(b=>b.disabled=false); resetar(); travado=false; erros=0;
  $("#msg").textContent = "Aperte os três símbolos na ordem certa.";
});
</script>
